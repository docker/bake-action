# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions
name: 'Matrix'
description: 'Generate a matrix from a Bake definition to help distributing builds in your workflow'

inputs:
  workdir:
    description: Working directory
    default: '.'
    required: false
  files:
    description: List of Bake files
    required: false
  target:
    description: Bake target
    required: false
  fields:
    description: List of extra fields to include in the matrix
    required: false
  changed-targets:
    description: List of Bake targets that have changed. This will cause the output to only include Bake targets which need to be rebuild.
    required: false

outputs:
  matrix:
    description: Matrix configuration
  max-layers:
    description: Max amount of layers in the layered matrix configuration
  layers:
    description: Current amount of layers in the layered matrix configuration
  layered-matrix:
    description: Layered matrix configuration

runs:
  using: 'node24'
  main: 'dist/index.cjs'
